[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
kajit = { path = "../crates-kajit/kajit" }
kajit-foundation = { path = "../crates-kajit/kajit-foundation" }
kajit-mir = { path = "../crates-kajit/kajit-mir" }
kajit-reprs = { path = "../crates-kajit/kajit-reprs" }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
