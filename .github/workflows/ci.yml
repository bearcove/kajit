name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  kajit-emit:
    runs-on: depot-ubuntu-24.04-16
    name: test (kajit-emit)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test kajit-emit
        run: cargo nextest run -p kajit-emit

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: depot-ubuntu-24.04-16
          - arch: aarch64-linux
            runner: depot-ubuntu-24.04-arm-16
          - arch: x86_64-windows
            runner: depot-windows-2025-16
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install LLVM/LLDB 21
        if: runner.os == 'Linux'
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev lldb-21 liblldb-21-dev
          echo "LLVM_CONFIG=/usr/bin/llvm-config-21" >> "$GITHUB_ENV"

      - name: Check
        run: cargo check

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run
