[package]
name = "kajit-mir"
version = "0.1.0"
edition = "2024"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
kajit-ir = { path = "../kajit-ir" }
kajit-lir = { path = "../kajit-lir" }
indexmap = "2"
regalloc2 = "0.15"

[dev-dependencies]
facet = { git = "https://github.com/facet-rs/facet", branch = "main" }
kajit-ir-text = { path = "../kajit-ir-text" }
