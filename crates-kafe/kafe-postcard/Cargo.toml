[package]
name = "kafe-postcard"
version = "0.1.0"
edition = "2024"
authors = ["Amos Wenger <amos@bearcove.eu>"]
description = "Postcard HIR generation for kajit"
repository = "https://github.com/bearcove/kajit"
license = "MIT OR Apache-2.0"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
facet = "0.44"
kafe = { path = "../kafe" }
kajit-hir = { path = "../../crates-kajit/kajit-hir" }
kafe-malum = { path = "../kafe-malum" }
kajit-types = { path = "../../crates-kajit/kajit-types" }
