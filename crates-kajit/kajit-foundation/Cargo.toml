[package]
name = "kajit-foundation"
version = "0.1.0"
edition = "2024"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
facet = { version = "0.44", features = ["indexmap"] }
facet-styx = "3.0.1"
indexmap = "2"
prettyplease = "0.2"
styx-tree = { version = "3.0.1", features = ["facet"] }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
tempfile = "3"
