[package]
name = "kajit-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kajit"
path = "src/main.rs"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[features]
default = []

[dependencies]
chumsky = "1.0.0-alpha.8"
facet = "0.44"
figue = "2"
kajit-asm = { path = "../kajit-asm" }
kajit-reprs = { path = "../kajit-reprs" }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
