[package]
name = "kajit-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kajit"
path = "src/main.rs"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[features]
default = ["lldb"]
lldb = ["dep:lldb"]

[dependencies]
kajit = { path = "../kajit" }
lldb = { path = "../../vendor/lldb-rs", optional = true }
kajit-hir = { path = "../kajit-hir" }
kajit-ir = { path = "../kajit-ir" }
kajit-hir-text = { path = "../kajit-hir-text" }
kajit-ir-text = { path = "../kajit-ir-text" }
kajit-lir = { path = "../kajit-lir" }
kajit-mir = { path = "../kajit-mir" }
kajit-mir-text = { path = "../kajit-mir-text" }
kajit-types = { path = "../kajit-types" }
facet = "0.44"
figue = "2"
rust-mcp-sdk = { version = "0.8", default-features = false, features = [
  "stdio",
  "server",
  "macros",
] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
