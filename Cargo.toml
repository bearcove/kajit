[workspace]
members = [
  # ~~~~~~~~~~~~~~~~~~
  "kajit/kajit-asm",
  "kajit/kajit-mir",
  "kajit/kajit-wares",
  "kajit/kajit-hir",
  "kajit/kajit-cli",
  "kajit/kajit-reprs",
  "kajit/kajit-types",

  # ~~~~~~~~~~~~~~~~~~
  "kali/kali-gen",
  "kali/kali",

  # ~~~~~~~~~~~~~~~~~~
  "kajit/vendor/lldb-rs",
  "kajit/vendor/lldb-sys-rs",
]
resolver = "3"

[workspace.dependencies]
# Internal
kajit-asm = { path = "kajit/kajit-asm" }
kajit-hir = { path = "kajit/kajit-hir" }
kajit-mir = { path = "kajit/kajit-mir" }
kajit-reprs = { path = "kajit/kajit-reprs" }
kajit-types = { path = "kajit/kajit-types" }
kajit-wares = { path = "kajit/kajit-wares" }

# Third-party
ariadne = "0.6"
chumsky = "1.0.0-alpha.8"
facet = "0.46"
facet-reflect = "0.46"
facet-styx = "3.0.2"
figue = "2.0.3"
indexmap = "2"
object = { version = "0.39", features = ["write"] }
prettyplease = "0.2"
proptest = "1"
styx-tree = { version = "3.0.2", features = ["facet"] }
syn = { version = "2", features = ["full"] }
tempfile = "3"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
