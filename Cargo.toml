[workspace]
members = [
  "crates-kajit/kajit-asm",
  "crates-kajit/kajit-mir",
  "crates-kajit/kajit-wares",
  "crates-kajit/kajit-hir",
  "crates-kajit/kajit-cli",
  "crates-kajit/kajit-reprs",
  "crates-kajit/kajit-foundation",
  "crates-kajit/kajit-foundation-cli",
  "crates-kajit/kajit-types",
  "xtask",
  "vendor/lldb-rs",
  "vendor/lldb-sys-rs",
  # Temporarily quarantined legacy pipeline / stale deps:
  # "crates-kajit/kajit",
  # "crates-kajit/kajit-ir",
  # "crates-kajit/kajit-lir",
  # "crates-kajit/kajit-mir-legacy",
  # "crates-kafe/kafe",
  # "crates-kafe/kafe-malum",
  # "crates-kafe/kafe-postcard",
  # "crates-kafe/kafe-vtables",
]
exclude = [
  "crates-kajit/kajit",
  "crates-kajit/kajit-ir",
  "crates-kajit/kajit-lir",
  "crates-kajit/kajit-mir-legacy",
  "crates-kafe/kafe",
  "crates-kafe/kafe-malum",
  "crates-kafe/kafe-postcard",
  "crates-kafe/kafe-vtables",
]
resolver = "3"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[patch.crates-io]
facet-styx = { path = "../styx/crates/facet-styx" }
facet = { path = "../facet/facet" }
facet-core = { path = "../facet/facet-core" }
facet-error = { path = "../facet/facet-error" }
facet-macro-parse = { path = "../facet/facet-macro-parse" }
facet-macro-types = { path = "../facet/facet-macro-types" }
facet-macros = { path = "../facet/facet-macros" }
facet-macros-impl = { path = "../facet/facet-macros-impl" }
facet-path = { path = "../facet/facet-path" }
facet-pretty = { path = "../facet/facet-pretty" }
facet-reflect = { path = "../facet/facet-reflect" }
facet-solver = { path = "../facet/facet-solver" }
facet-testhelpers = { path = "../facet/facet-testhelpers" }
facet-testhelpers-macros = { path = "../facet/facet-testhelpers-macros" }
