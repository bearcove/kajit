[workspace]
members = [
  "crates-kajit/kajit-asm",
  "crates-kajit/kajit-mir",
  "crates-kajit/kajit-wares",
  "crates-kajit/kajit-hir",
  "crates-kajit/kajit-cli",
  "crates-kajit/kajit-reprs",
  "crates-kajit/kajit-foundation",
  "crates-kajit/kajit-foundation-cli",
  "crates-kajit/kajit-types",
  "xtask",
  "vendor/lldb-rs",
  "vendor/lldb-sys-rs",
  # Temporarily quarantined legacy pipeline / stale deps:
  # "crates-kajit/kajit",
  # "crates-kajit/kajit-ir",
  # "crates-kajit/kajit-lir",
  # "crates-kajit/kajit-mir-legacy",
  # "crates-kafe/kafe",
  # "crates-kafe/kafe-malum",
  # "crates-kafe/kafe-postcard",
  # "crates-kafe/kafe-vtables",
]
exclude = [
  "crates-kajit/kajit",
  "crates-kajit/kajit-ir",
  "crates-kajit/kajit-lir",
  "crates-kajit/kajit-mir-legacy",
  "crates-kafe/kafe",
  "crates-kafe/kafe-malum",
  "crates-kafe/kafe-postcard",
  "crates-kafe/kafe-vtables",
]
resolver = "3"

[workspace.dependencies]
# Internal
kajit-asm = { path = "crates-kajit/kajit-asm" }
kajit-foundation = { path = "crates-kajit/kajit-foundation" }
kajit-hir = { path = "crates-kajit/kajit-hir" }
kajit-mir = { path = "crates-kajit/kajit-mir" }
kajit-reprs = { path = "crates-kajit/kajit-reprs" }
kajit-types = { path = "crates-kajit/kajit-types" }
kajit-wares = { path = "crates-kajit/kajit-wares" }

# Third-party
ariadne = "0.6"
chumsky = "1.0.0-alpha.8"
facet = "0.44"
facet-styx = "3.0.1"
figue = "2"
indexmap = "2"
object = { version = "0.39", features = ["write"] }
prettyplease = "0.2"
proptest = "1"
styx-tree = { version = "3.0.1", features = ["facet"] }
syn = { version = "2", features = ["full"] }
tempfile = "3"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

