[package]
name = "kajit"
version = "0.1.0"
edition = "2024"
authors = ["Amos Wenger <amos@bearcove.eu>"]
description = "Fast deserialization in Rust, based on facet reflection"
repository = "https://github.com/bearcove/kajit"
license = "MIT OR Apache-2.0"
keywords = ["deserialization", "facet", "reflection", "fast"]
categories = ["encoding", "data-structures"]
readme = "README.md"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
facet = "0.44"
itoa = "1"
object = { version = "0.36", features = ["write"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zmij = "1"
kajit-ir = { path = "../kajit-ir" }
kajit-ir-text = { path = "../kajit-ir-text" }
kajit-lir = { path = "../kajit-lir" }
kajit-mir = { path = "../kajit-mir" }
kajit-mir-text = { path = "../kajit-mir-text" }
kajit-emit = { path = "../kajit-emit" }
kajit-emit-text = { path = "../kajit-emit-text" }
kajit-format = { path = "../kajit-format" }
kajit-hir = { path = "../kajit-hir" }
kajit-malum = { path = "../kajit-malum" }
kajit-postcard = { path = "../kajit-postcard" }
kajit-types = { path = "../kajit-types" }

[dev-dependencies]
kajit-hir-text = { path = "../kajit-hir-text" }
kajit-emit-text = { path = "../kajit-emit-text" }
libc = "0.2"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaxpeax-arm = { version = "0.4", default-features = false, features = ["std", "fmt"] }
yaxpeax-x86 = { version = "2", default-features = false, features = ["std", "fmt"] }
yaxpeax-arch = { version = "0.3", default-features = false, features = ["std"] }
brotli = "8"
facet-testhelpers = "0.44"
insta = "1"
proptest = "1"
proptest-derive = "0.5"

[[bench]]
name = "synthetic"
harness = false
